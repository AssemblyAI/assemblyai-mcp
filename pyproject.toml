[project]
name = "assemblyai-mcp"
version = "0.1.0"
description = "MCP server wrapping AssemblyAI for the Databricks Marketplace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.27.0",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
assemblyai-mcp = "assemblyai_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assemblyai_mcp"]

[dependency-groups]
dev = [
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
